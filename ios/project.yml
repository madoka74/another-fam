name: AnotherFam
options:
  bundleIdPrefix: com.blankishworks
  deploymentTarget:
    visionOS: "2.0"
    iOS: "18.0"
targets:
  # 비전프로 전용 앱
  AnotherFam:
    type: application
    platform: visionOS
    sources:
      - path: AnotherFam
        excludes: ["Model/**", "Sounds/**"]
      # 말티즈 그물·움직임·털 무늬, 블랭키씨 인형 (tools/ 로 만들어 저장소에 둠 — 빌드 때 지우지 않음)
      - path: AnotherFam/Model
        type: folder
        buildPhase: resources
      # 소리 (tools/dog_sounds.py 로 만들어 저장소에 둠)
      - path: AnotherFam/Sounds
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blankishworks.another-fam
        PRODUCT_NAME: AnotherFam
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "7"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
    # 아이클라우드 키-값 저장소: 아이폰 앱과 강아지 상태를 나눔 + 다시 설치해도 되살림 (App ID 에 iCloud 를 켜 둬야 함)
    entitlements:
      path: AnotherFam/AnotherFam.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: AnotherFam/Info.plist
      properties:
        CFBundleDisplayName: 어나더 팸
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSHandsTrackingUsageDescription: 손으로 강아지를 쓰다듬고 안아 주고, 장난감과 물건을 집는 데 사용합니다. 손 정보는 저장하지 않습니다.
        NSWorldSensingUsageDescription: 강아지가 실제 바닥과 가구 사이를 다니고 가구 뒤로 가려지게 하는 데 사용합니다. 공간 정보는 저장하지 않습니다.
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}

  # 아이폰 짝 앱: 강아지 소식 보기 + 배고픔·목마름 등 알림 (0.3.0)
  # 비전 앱과 같은 번들 ID — App Store Connect 의 '어나더 팸' 앱에 iOS 플랫폼으로 올라감 (비전 드럼 킥과 같은 방식)
  FamPhone:
    type: application
    platform: iOS
    sources:
      - path: FamPhone
      # 시간 흐름·저장 규칙은 비전 앱과 같은 파일을 그대로 씀 (알림 시각을 같은 계산으로 맞추려고)
      - path: AnotherFam/Sim.swift
      # 지금 모습을 3D 로 보여 주려고 강아지 그물·털·움직임도 비전 앱과 같은 파일·같은 자료를 씀 (0.4.0)
      - path: AnotherFam/DogRig.swift
      - path: AnotherFam/DogAnim.swift
      - path: AnotherFam/DogSkin.swift
      - path: AnotherFam/Model
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blankishworks.another-fam
        PRODUCT_NAME: FamPhone
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: FamPhone/FamPhone.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    info:
      path: FamPhone/Info.plist
      properties:
        CFBundleDisplayName: 어나더 팸
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.blankishworks.another-fam.refresh]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
