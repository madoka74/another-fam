# 어나더 팸 비전프로 앱 + 아이폰 알림 앱 빌드 → TestFlight 업로드 (두 일이 따로 동시에 돎 — 한쪽이 실패해도 다른 쪽은 올라감)
# ios/ 파일이나 version.json 을 GitHub에 올리면 자동으로 돌고, Actions 탭에서 'Run workflow'로 직접 돌릴 수도 있음.
# 필요한 저장소 Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, SIGN_P12, SIGN_P12_PASSWORD (다른 앱과 같은 값)
name: visionOS TestFlight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', 'version.json', '.github/workflows/ios.yml']
concurrency: { group: ios, cancel-in-progress: true }
jobs:
  vision:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: 비전프로(visionOS) 빌드 도구 확인
        run: |
          if xcodebuild -showsdks | grep -q xros; then echo "visionOS SDK 있음"; else xcodebuild -downloadPlatform visionOS; fi
      - name: 모델·소리 파일 확인
        run: |
          for f in dog.bin dog_anim.bin fur_c.png fur_h.png blanky_toy.bin; do
            test -f "ios/AnotherFam/Model/$f" || { echo "::error::ios/AnotherFam/Model/$f 이 없어요 — 압축 파일의 Model 폴더를 그대로 올려 주세요"; exit 1; }
          done
          n=$(ls ios/AnotherFam/Sounds/*.wav 2>/dev/null | wc -l)
          echo "소리 ${n}개"
          if [ "$n" -lt 50 ]; then echo "::error::ios/AnotherFam/Sounds 의 소리(.wav)가 빠졌어요 — 압축 파일의 Sounds 폴더를 그대로 올려 주세요"; exit 1; fi
      - name: XcodeGen으로 프로젝트 만들기
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: App Store Connect API 키 준비
        env: { ASC_KEY_P8: '${{ secrets.ASC_KEY_P8 }}' }
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: 고정 서명 인증서 넣기 (SIGN_P12가 있을 때만)
        env:
          P12: ${{ secrets.SIGN_P12 }}
          PW: ${{ secrets.SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "SIGN_P12 없음: 빌드마다 새 개발 인증서가 만들어집니다"; exit 0; fi
          KC="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p tmp "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p tmp "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$PW" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k tmp "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
      - name: 비전프로 빌드(아카이브)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          VER=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          BUILD=$(( ${{ github.run_number }} + 100 ))
          xcodebuild -project ios/AnotherFam.xcodeproj -scheme AnotherFam -configuration Release \
            -destination 'generic/platform=visionOS' -archivePath "$RUNNER_TEMP/AnotherFam.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM" MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 60
          test -d "$RUNNER_TEMP/AnotherFam.xcarchive"
      - name: 실패하면 오류 줄만 모아 보기
        if: failure()
        run: |
          L="$RUNNER_TEMP/build.log"
          test -f "$L" || exit 0
          echo "===== 오류 (error:) ====="
          grep -n -E "error:|ARCHIVE FAILED|Code Signing|requires a provisioning profile|No profiles|fatal|Stack dump|crashed|unable to type-check" "$L" | grep -v "warning:" | head -60 || true
          echo "===== 실패한 단계 ====="
          grep -n -A 12 "The following build commands failed" "$L" | head -40 || true
          echo "===== 실패 줄 앞뒤 ====="
          grep -n -B 25 -E "\*\* ARCHIVE FAILED" "$L" | grep -v -E "^[0-9]+-\s*$" | head -40 || true
      - name: TestFlight로 올리기
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/TEAM_ID/$TEAM/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          # 애플 서버가 잠깐 응답하지 않으면(Bad Gateway 등) 1분 쉬고 다시 (최대 4번)
          for i in 1 2 3 4; do
            if xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AnotherFam.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/out" \
              -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
              -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"; then
              break
            fi
            if [ "$i" = 4 ]; then exit 70; fi
            echo "::warning::내보내기 실패 ($i/4) — 애플 서버 문제일 수 있어 60초 뒤 다시 시도"
            sleep 60
          done

  # 아이폰 짝 앱 (비전 앱과 같은 번들 ID — App Store Connect 의 '어나더 팸' 앱에 iOS 플랫폼을 한 번 추가해 둬야 올라감)
  phone:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: XcodeGen으로 프로젝트 만들기
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: App Store Connect API 키 준비
        env: { ASC_KEY_P8: '${{ secrets.ASC_KEY_P8 }}' }
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: 고정 서명 인증서 넣기 (SIGN_P12가 있을 때만)
        env:
          P12: ${{ secrets.SIGN_P12 }}
          PW: ${{ secrets.SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "SIGN_P12 없음: 빌드마다 새 개발 인증서가 만들어집니다"; exit 0; fi
          KC="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p tmp "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p tmp "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$PW" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k tmp "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
      - name: 아이폰 빌드(아카이브)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          VER=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          BUILD=$(( ${{ github.run_number }} + 100 ))
          xcodebuild -project ios/AnotherFam.xcodeproj -scheme FamPhone -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/FamPhone.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM" MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 60
          test -d "$RUNNER_TEMP/FamPhone.xcarchive"
      - name: 실패하면 오류 줄만 모아 보기
        if: failure()
        run: |
          L="$RUNNER_TEMP/build.log"
          test -f "$L" || exit 0
          echo "===== 오류 (error:) ====="
          grep -n -E "error:|ARCHIVE FAILED|Code Signing|requires a provisioning profile|No profiles|fatal|unable to type-check" "$L" | grep -v "warning:" | head -60 || true
          echo "===== 실패한 단계 ====="
          grep -n -A 12 "The following build commands failed" "$L" | head -40 || true
      - name: TestFlight로 올리기
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/TEAM_ID/$TEAM/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          for i in 1 2 3 4; do
            if xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FamPhone.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/out" \
              -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
              -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"; then
              break
            fi
            if [ "$i" = 4 ]; then
              echo "::error::아이폰 앱 업로드 실패 — App Store Connect › 어나더 팸 앱에 'iOS' 플랫폼이 추가돼 있는지 확인해 주세요"
              exit 70
            fi
            echo "::warning::내보내기 실패 ($i/4) — 60초 뒤 다시 시도"
            sleep 60
          done
